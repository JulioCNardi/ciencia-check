services:
  mysql:
    image: mysql:8.4
    container_name: ciencia-check-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ciencia_check
    volumes:
      - ciencia_check_mysql:/var/lib/mysql
    command: ["--default-authentication-plugin=caching_sha2_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

volumes:
  ciencia_check_mysql:
